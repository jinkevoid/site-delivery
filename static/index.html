<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>局点交付管理</title><link rel="stylesheet" href="/style.css"><style>[hidden]{display:none!important}</style></head><body>
<div id="login" class="login"><form id="loginForm" class="login-card"><div class="logo">N</div><h1>局点交付管理</h1><p>登录以查看和管理交付进展</p><label>账号<input name="username" required autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button class="primary">登录</button><p id="loginError" class="error"></p></form></div>
<div id="app" hidden><aside><div class="brand"><span class="logo">N</span><span><b>NetDelivery</b><small>局点交付管理</small></span></div><nav><button class="active" data-view="home">⌂　工作台</button><button data-view="sites">▦　局点</button><button data-view="settings">⚙　设置</button></nav><div class="profile"><span id="profileName"></span><button id="logout">退出</button></div></aside><main><header><div><h1 id="heading">工作台</h1><p id="subtitle">快速找到局点并记录进展</p></div><div class="actions"><button id="theme" title="切换主题">◐</button><button class="primary" id="newSite">＋ 新建局点</button></div></header>
<section id="home" class="view"><div class="search"><span>⌕</span><input id="search" placeholder="搜索局点名称，快速记录进展…"></div><div id="searchResults" class="search-results"></div><div class="section-head"><h2>星标局点</h2><span>点击记录进展</span></div><div class="cards" id="starCards"></div><div class="section-head"><h2>最近使用</h2><span>点击记录进展</span></div><div class="cards" id="recentCards"></div><div class="section-head"><h2>有待办的局点</h2><span>点击处理待办</span></div><div class="cards" id="todoCards"></div></section>
<section id="sites" class="view" hidden><div class="toolbar"><input id="filter" placeholder="搜索局点名称…"><select id="filterOwner"><option value="">全部负责人</option></select><select id="filterRegion"><option value="">全部大区</option></select><select id="filterStatus"><option value="">全部状态</option></select></div><div class="panel table-wrap"><table><thead><tr><th>★</th><th>局点名称</th><th>国家 / 城市</th><th>运营商</th><th>大区</th><th>负责人</th><th>状态</th><th>最新进展</th><th>操作</th></tr></thead><tbody id="siteRows"></tbody></table><div id="count" class="count"></div></div></section>
<section id="settings" class="view" hidden><div class="panel settings"><h2>全局自定义字段</h2><p class="muted">创建后可在局点详情中填写</p><form id="fieldForm" class="inline"><input name="name" placeholder="字段名称" required><select name="kind"><option value="text">文本</option><option value="number">数字</option><option value="date">日期</option><option value="boolean">是/否</option></select><button class="primary">添加字段</button></form><div id="fieldList"></div><div id="userSection"><h2>用户管理</h2><form id="userForm" class="inline"><input name="username" placeholder="账号" required><input name="name" placeholder="姓名" required><input name="password" type="password" placeholder="初始密码" required><button class="primary">创建用户</button></form><div id="userList"></div></div></div></section></main></div>
<div id="shade" class="shade" hidden></div><aside id="drawer" class="drawer" hidden><div class="drawer-head"><div><small>局点详情</small><h2 id="drawerTitle"></h2></div><button id="closeDrawer">×</button></div><div class="tabs"><button class="active" data-tab="info">基本信息</button><button data-tab="progress">历史进展</button><button data-tab="todos">待办</button><button data-tab="files">附件</button><button data-tab="people">联系人与群聊</button></div><div id="drawerBody"></div></aside>
<dialog id="siteDialog"><form id="siteForm"><h2 id="siteFormTitle">新建局点</h2><div class="formgrid"><label>局点名称<input name="name" required></label><label>负责人<select name="owner_id" required></select></label><label>状态<input name="status" value="未开始"></label><label>大区<input name="region"></label><label>国家或地区<input name="country"></label><label>城市<input name="city"></label><label>运营商<input name="operator"></label><label>备注<input name="remark"></label></div><div class="dialog-actions"><button type="button" data-close="siteDialog">取消</button><button class="primary">保存</button></div></form></dialog>
<dialog id="progressDialog"><form id="progressForm"><h2>新增进展</h2><p id="progressSite" class="muted"></p><label>事件发生时间<input name="occurred_at" type="datetime-local" required></label><label>进展内容<textarea name="content" rows="4" required placeholder="记录本次完成的工作和当前进展"></textarea></label><label>问题或阻塞<input name="issue"></label><div class="todo-box"><label><input name="hasTodo" type="checkbox"> 同时创建待办</label><div id="todoInputs" hidden><label>待办内容<input name="todo"></label><label>截止日期<input name="due_date" type="date"></label></div></div><div class="dialog-actions"><button type="button" data-close="progressDialog">取消</button><button class="primary">保存进展</button></div></form></dialog><div id="toast"></div><script src="/app.js"></script></body></html>
